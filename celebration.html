<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yay! 💖</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  text-align: center;
}
h1 {
  font-size: 36px;
  margin-bottom: 10px;
}
img {
  max-width: 250px;
  margin-bottom: 20px;
  border-radius: 10px;
}
.floating-heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp linear infinite;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity: 1; }
  100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
}
</style>
</head>
<body>

<h1>Yay! 💖</h1>
<img src="https://media.giphy.com/media/31lPv5L3aIvTi/giphy.gif" alt="Friends Excited GIF">
<div>I Can't Wait To See You 💖</div>

<script>
// Floating hearts animation
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.color = ["#ff2f92","#ff69b4","#ffb6c1","#ff66cc"][Math.floor(Math.random()*4)];
  heart.innerText = "💖";
  heart.style.fontSize = (10 + Math.random()*30) + "px";
  heart.style.animationDuration = (1 + Math.random()*2) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 4000);
}, 300);
</script>

</body>
</html>
